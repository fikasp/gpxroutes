<!-- @p GPX Routes
------------------------->
<!doctype html>
<html lang="pl">
	<!--====================-->
	<!--#region @r HEAD -->
	<!--====================-->
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Font Avesome -->
		<link rel="stylesheet" href="vendor/fontawesome.css" />
		<!-- Leaflet (mapa OpenStreetMap / OpenTopoMap) -->
		<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
		<!-- Styles -->
		<link rel="stylesheet" href="styles.css" />
		<!-- Title -->
		<title>GPX Routes</title>
	</head>
	<!--#endregion -->
	<!--====================-->
	<!--#region @r BODY -->
	<!--====================-->
	<body>
		<!------------------------
		 @g HEADER
		------------------------->
		<header>GPX Routes</header>
		<!------------------------
		 @g MAIN
		------------------------->
		<main>
			<!-- Map -->
			<div id="map" class="main__map"></div>
			<!-- Panel -->
			<aside id="panel" class="main__panel">
				<div id="panel-resizer" class="panel__resizer"></div>
				<div class="panel__header">
					<h2 class="panel__title">Trasy (<span id="panel-count">0</span>)</h2>
				</div>
				<div id="panel-basemap" class="panel__basemap" title="Podkład mapy">
					<button class="panel__basemap-btn" data-basemap="osm">Standardowa</button>
					<button class="panel__basemap-btn" data-basemap="topo">Turystyczna</button>
				</div>
				<div class="panel__global">
					<div class="panel__global-top">
						<input type="color" id="panel-global-color" class="panel__item-color" title="Kolor wszystkich tras" />
						<span class="panel__global-label">Wszystkie trasy</span>
					</div>
					<div class="panel__item-width">
						<span id="panel-global-weight" class="panel__item-weight"></span>
						<input type="range" id="panel-global-range" class="panel__item-range" title="Grubość wszystkich tras" />
					</div>
				</div>
				<ul id="panel-list" class="panel__list"></ul>
				<div class="panel__actions">
					<input type="file" id="panel-import-input" accept=".gpx" multiple style="display: none" />

					<button id="panel-import-btn" class="panel__button panel__button--import">Wczytaj</button>
					<button id="panel-clear" class="panel__button panel__button--clear">Wyczyść</button>
				</div>
			</aside>
			<!-- Zoom indicator -->
			<div id="zoom-indicator" class="main__zoom"></div>
			<button id="panel-toggle" class="panel__toggle" aria-label="Zwiń/rozwiń panel" title="Zwiń/rozwiń panel"></button>
		</main>
		<!------------------------
		 @g FOOTER
		------------------------->
		<footer>2026 © Przemysław Fikas</footer>
		<!------------------------
		 @g MODALS
		------------------------->
		<div class="modal">
			<div class="modal__container">
				<button class="modal__close" aria-label="Close">&times;</button>
				<div class="modal__content">
					<!-- Modal content -->
				</div>
			</div>
		</div>
		<!-- @b Modal alert
		------------------------->
		<template id="modal-alert">
			<h2 class="modal__title"></h2>
			<p class="modal__text"></p>
			<div class="modal__buttons">
				<button class="modal__button">OK</button>
			</div>
		</template>
		<!-- @b Modal confirm
		------------------------->
		<template id="modal-confirm">
			<h2 class="modal__title"></h2>
			<p class="modal__text"></p>
			<div class="modal__buttons">
				<button class="modal__button modal__button--cancel">Anuluj</button>
				<button class="modal__button modal__button--confirm">Potwierdź</button>
			</div>
		</template>
		<!------------------------
		 @g SCRIPT
		------------------------->
		<!-- Leaflet -->
		<script src="vendor/leaflet/leaflet.js"></script>
		<!-- App -->
		<script src="script.js"></script>
	</body>
	<!--#endregion -->
</html>
