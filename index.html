<!-- @p GPX Studio
------------------------->
<!doctype html>
<html lang="pl">
	<!--====================-->
	<!--#region @r HEAD -->
	<!--====================-->
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Font Avesome -->
		<link rel="stylesheet" href="vendor/fontawesome.css" />
		<!-- Leaflet (mapa OpenStreetMap / OpenTopoMap) -->
		<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
		<!-- Styles -->
		<link rel="stylesheet" href="styles.css" />
		<!-- Title -->
		<title>GPX Studio</title>
	</head>
	<!--#endregion -->
	<!--====================-->
	<!--#region @r BODY -->
	<!--====================-->
	<body>
		<!------------------------
		 @g HEADER
		------------------------->
		<header>GPX Studio</header>
		<!------------------------
		 @g MAIN
		------------------------->
		<main>
			<!-- Map -->
			<div id="map" class="main__map"></div>
			<!-- Panel -->
			<aside id="panel" class="main__panel">
				<div id="panel-resizer" class="panel__resizer"></div>
				<!-- Basemap -->
				<select id="panel-basemap" class="panel__select" title="Podkład mapy">
					<option value="osmShade">Mapa cieniowana (OpenStreetMap)</option>
					<option value="osm">Mapa standardowa (OpenStreetMap)</option>
					<option value="topo">Mapa turystyczna (OpenTopoMap)</option>
					<option value="outdoor">Mapa outdoorowa (Freemap)</option>
				</select>
				<!-- Tabs -->
				<div id="panel-tabs" class="panel__tabs">
					<button class="panel__tab panel__tab--active" data-tab="routes">
						Trasy (<span id="routes-count">0</span>)
					</button>
					<button class="panel__tab" data-tab="points">Punkty (<span id="points-count">0</span>)</button>
				</div>
				<!-- Section: routes -->
				<div id="section-routes" class="panel__section">
					<div id="panel-global" class="panel__global"></div>
					<div id="panel-routes-list" class="panel__list"></div>
				</div>
				<!-- Section: points -->
				<div id="section-points" class="panel__section" hidden>
					<div class="panel__toolbar">
						<button id="panel-sort" class="panel__tool panel__tool--sort" title="Sortuj alfabetycznie">A→Z</button>
						<button
							id="panel-add-mode"
							class="panel__tool panel__tool--add"
							title="Tryb dodawania: klikaj na mapie, aby dodać punkty (Esc wyłącza)"
						>
							＋ Dodawanie
						</button>
					</div>
					<ul id="panel-points-list" class="panel__list"></ul>
				</div>
				<!-- Actions -->
				<div class="panel__actions">
					<input type="file" id="panel-import-input" accept=".gpx" multiple style="display: none" />

					<button id="panel-import-btn" class="panel__button panel__button--import">Wczytaj</button>
					<button id="panel-save" class="panel__button panel__button--save" hidden>Zapisz</button>
					<button id="panel-clear" class="panel__button panel__button--clear">Wyczyść</button>
				</div>
			</aside>
			<!-- Zoom indicator -->
			<div id="zoom-indicator" class="main__zoom"></div>
			<button id="panel-toggle" class="panel__toggle" aria-label="Zwiń/rozwiń panel" title="Zwiń/rozwiń panel"></button>
		</main>
		<!------------------------
		 @g FOOTER
		------------------------->
		<footer>2026 © Przemysław Fikas</footer>
		<!------------------------
		 @g MODALS
		------------------------->
		<div class="modal">
			<div class="modal__container">
				<button class="modal__close" aria-label="Close">&times;</button>
				<div class="modal__content">
					<!-- Modal content -->
				</div>
			</div>
		</div>
		<!-- @b Modal alert
		------------------------->
		<template id="modal-alert">
			<h2 class="modal__title"></h2>
			<p class="modal__text"></p>
			<div class="modal__buttons">
				<button class="modal__button">OK</button>
			</div>
		</template>
		<!-- @b Modal confirm
		------------------------->
		<template id="modal-confirm">
			<h2 class="modal__title"></h2>
			<p class="modal__text"></p>
			<div class="modal__buttons">
				<button class="modal__button modal__button--cancel">Anuluj</button>
				<button class="modal__button modal__button--confirm">Potwierdź</button>
			</div>
		</template>
		<!------------------------
		 @g TEMPLATES
		------------------------->
		<!-- @b Track item
		------------------------->
		<template id="track-item">
			<div class="panel__item">
				<button class="panel__item-style" title="Kolor i grubość linii"></button>
				<div class="panel__item-main">
					<span class="panel__item-name"></span>
					<span class="panel__item-meta"></span>
				</div>
				<button class="panel__item-delete" title="Usuń trasę">×</button>
			</div>
		</template>
		<!-- @b Style picker
		------------------------->
		<template id="style-picker">
			<div class="style-picker">
				<div class="style-picker__palette"></div>
				<div class="style-picker__width">
					<input type="range" class="style-picker__range" title="Grubość linii" />
					<span class="style-picker__label"></span>
				</div>
			</div>
		</template>
		<!-- @b Map popup
		------------------------->
		<template id="map-popup">
			<div class="map-popup">
				<div class="map-popup__title"></div>
				<div class="map-popup__desc"></div>
				<div class="map-popup__actions">
					<button class="map-popup__btn-edit">✎ Edytuj</button>
					<button class="map-popup__btn-delete">× Usuń</button>
				</div>
			</div>
		</template>
		<!-- @b Map popup form
		------------------------->
		<template id="map-popup-form">
			<div class="map-popup map-popup--form">
				<input type="text" class="map-popup__input" placeholder="Nazwa obiektu" maxlength="100" />
				<textarea class="map-popup__textarea" placeholder="Opis (opcjonalnie)" rows="2"></textarea>
				<div class="map-popup__actions">
					<button class="map-popup__btn-cancel">Anuluj</button>
					<button class="map-popup__btn-save">Zapisz</button>
				</div>
			</div>
		</template>
		<!------------------------
		 @g SCRIPT
		------------------------->
		<!-- Leaflet -->
		<script src="vendor/leaflet/leaflet.js"></script>
		<!-- App -->
		<script src="script.js"></script>
	</body>
	<!--#endregion -->
</html>
